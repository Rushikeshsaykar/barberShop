name: barbershop
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/mail_logo.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/bgRemove_Logo.png"

flutter_native_splash:
  color: "#F0D2AC"
  image: assets/icon/bgRemove_Logo.png

  android_12:
    color: "#F0D2AC"
    image: assets/icon/bgRemove_Logo.png
    icon_background_color: "#F0D2AC"

  ios_content_mode: center

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/